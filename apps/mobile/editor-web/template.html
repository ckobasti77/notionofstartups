<!DOCTYPE html>
<html lang="sr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <title>Beleška</title>
  </head>
  <!--
    Stil je FUNKCIONALAN, ne dekoracija: bez apsolutnog pozicioniranja korenskog
    div-a editor nema visinu i skrol unutar WebView-a ne radi. Kopija
    `@10play/tentap-editor/src/simpleWebEditor/index.html`. Boje i tipografija
    NISU ovde — one stižu iz `noteEditorCss` (`editor.injectCSS`), da prate temu.
  -->
  <style>
    body {
      margin: 0;
      padding: 0;
    }
    #root > div:nth-of-type(1) {
      position: absolute;
      height: 100%;
      overflow: auto;
      width: 100%;
      top: 0;
      bottom: 0;
    }
    #root > div.dynamic-height {
      height: unset;
    }
    #root div .ProseMirror {
      min-height: 100%;
      overflow: visible;
    }
    #root div.dynamic-height .ProseMirror {
      height: unset;
    }
    .ProseMirror:focus {
      outline: none;
    }
    .highlight-background {
      background-color: #e6e6ff;
    }
  </style>
  <body>
    <div id="root"></div>
  </body>
</html>
